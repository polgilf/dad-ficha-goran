<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Ficha de Goran. En construcción.">
    <meta name="color-scheme" content="light">
    <title>Ficha de Goran</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #f4f6f8;
        color: #1c2838;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: 100%;
        max-width: 36rem;
        padding: clamp(2rem, 7vw, 4rem);
        border: 1px solid #e2e7ed;
        border-radius: 1.5rem;
        background: #fff;
        box-shadow: 0 1rem 3rem #1c283808;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1.15;
        letter-spacing: -0.04em;
      }
      p {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        margin: 0;
        color: #596779;
        line-height: 1.6;
      }
      p::before {
        content: "";
        width: 0.55rem;
        height: 0.55rem;
        flex-shrink: 0;
        border-radius: 50%;
        background: #c18020;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ficha de Goran</h1>
      <p>En construcción</p>
    </main>
  </body>
</html>
